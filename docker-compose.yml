services:
  hsm-pkcs11-session-auditor:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY in your local .env}
      HSM_API_TOKEN: ${HSM_API_TOKEN:?Set HSM_API_TOKEN in your local .env}
    restart: unless-stopped
