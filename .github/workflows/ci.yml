name: Hsm Pkcs11 Session Auditor CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Pytest Suite
      run: |
        python -m compileall -q agents hsm_pkcs11_auditor
        pytest -v
        python -m pip check

    - name: Test browser evaluator
      run: |
        node --check web/app.js
        node --test web/test-app.cjs

    - name: Exercise audit integrity
      run: |
        python -c "from agents.base import AuditLogger; AuditLogger.log('ci', 'test', 'SMOKE', {'status': 'OK'}); assert AuditLogger.verify_integrity()"
